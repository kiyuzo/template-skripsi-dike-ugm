name: Compile LaTeX

on:
  push:
    branches: [ main, master ]
    paths:
      - 'template/**/*.tex'
      - 'template/**/*.bib'
      - 'template/**/*.cls'
      - 'docker/Dockerfile'
      - '.github/workflows/compile-latex.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'template/**/*.tex'
      - 'template/**/*.bib'
      - 'template/**/*.cls'
      - 'docker/Dockerfile'
      - '.github/workflows/compile-latex.yml'
  workflow_dispatch:

jobs:
  compile-thesis:
    runs-on: ubuntu-latest
    name: Compile Thesis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile thesis with Docker
        run: make thesis-docker

      - name: Upload thesis PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: template/thesis/main.pdf
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    name: Attach PDF to Release
    needs: [compile-thesis]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download thesis PDF
        uses: actions/download-artifact@v4
        with:
          name: thesis-pdf
          path: ./pdfs/thesis

      - name: Attach PDF to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./pdfs/thesis/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
